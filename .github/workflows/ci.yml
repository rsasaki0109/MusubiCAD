name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same pull request supersedes the running checks.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WGPU_BACKEND: vulkan

jobs:
  desktop-release-policy:
    name: desktop workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2

      - name: Verify desktop workflow syntax and trust boundaries
        run: python tools/test_desktop_release_policy.py

      - name: Verify shared release version contract
        run: python tools/test_release_version.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Mesa Vulkan (headless wgpu)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Example documents
        run: cargo test -p opencad-file example_ && cargo test -p opencad-cli example_

      - name: Golden regression
        run: cargo test -p opencad-feature golden_ && cargo test -p opencad-cli golden_

      - name: Render regression
        run: cargo test -p opencad-render

      - name: Test
        run: cargo test --workspace
