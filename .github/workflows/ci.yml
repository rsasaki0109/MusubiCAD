name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to the same pull request supersedes the running checks.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WGPU_BACKEND: vulkan
  # Keep full native test binaries within hosted/cloud disk budgets.
  # This changes debug information only; assertions and optimization are unchanged.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  desktop-release-policy:
    name: desktop workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2

      - name: Verify desktop workflow syntax and trust boundaries
        run: python tools/test_desktop_release_policy.py

      - name: Verify shared release version contract
        run: python tools/test_release_version.py

      - name: Verify agent plugin manifests and installer
        run: python tools/test_agent_plugin.py

      - name: Verify Codex smoke transport failures (no client/model required)
        run: python tools/test_codex_host_smoke.py

      - name: Verify flexible assembly analytic grader
        run: python tools/test_assembly_tutorial.py

      - name: Verify periodic native diagnostic report contract
        run: python tools/test_periodic_fillet_probe.py

      - name: Verify bounded Bezier diagnostic report contract
        run: python tools/test_reference_bezier_probe.py

      - name: Verify periodic band diagnostic report contract
        run: python tools/test_reference_band_probe.py

      - name: Verify closed reference diagnostic report contract
        run: python tools/test_closed_reference_probe.py

      - name: Verify repository Python cache hygiene
        run: python tools/test_repo_hygiene.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Mesa Vulkan (headless wgpu)
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nodebug-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nodebug-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Example documents
        run: cargo test -p opencad-file example_ && cargo test -p opencad-cli example_

      - name: Golden regression
        run: cargo test -p opencad-feature golden_ && cargo test -p opencad-cli golden_

      - name: Render regression
        run: cargo test -p opencad-render

      - name: Test
        run: cargo test --workspace

      - name: Reproduce pinned native periodic fillet counterexamples
        run: >-
          python tools/run_periodic_fillet_probe.py
          --occt-root target/cadrum-occt-v800-x86_64-unknown-linux-gnu
          --output target/periodic-fillet-diagnostic.json

      - name: Measure bounded native Bezier reference patches
        run: >-
          python tools/run_reference_bezier_probe.py
          --occt-root target/cadrum-occt-v800-x86_64-unknown-linux-gnu
          --output target/reference-bezier-diagnostic.json

      - name: Sew bounded native periodic reference bands
        run: >-
          python tools/run_reference_band_probe.py
          --occt-root target/cadrum-occt-v800-x86_64-unknown-linux-gnu
          --output target/reference-band-diagnostic.json

      - name: Measure closed native reference approximations
        run: >-
          python tools/run_closed_reference_probe.py
          --occt-root target/cadrum-occt-v800-x86_64-unknown-linux-gnu
          --output target/closed-reference-diagnostic.json

      - name: Upload native reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-fillet-diagnostic-${{ github.run_id }}
          path: |
            target/periodic-fillet-diagnostic.json
            target/reference-bezier-diagnostic.json
            target/reference-band-diagnostic.json
            target/closed-reference-diagnostic.json
          if-no-files-found: warn

      - name: Execute reproducible MCP editing tutorial
        run: python tools/run_editing_tutorial.py

      - name: Execute flexible assembly tutorial
        run: python tools/run_assembly_tutorial.py --binary target/debug/musubicad > target/assembly-tutorial-report.json
