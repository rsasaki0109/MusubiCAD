name: Desktop

# This workflow is intentionally unsigned. It is allowed to run for pull
# requests and main, has read-only repository permissions, and only uploads
# disposable CI artifacts. Credential-gated signing and release publication
# live in desktop-signed-release.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop.yml
      - apps/desktop/**
      - modules/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - docs/developer-guide/desktop-ui.md
      - docs/developer-guide/occt-install.md
      - docs/developer-guide/releases.md
      - docs/developer-guide/desktop-releases.md
      - docs/api/desktop.md
      - tools/package-desktop-release.ps1
      - tools/desktop-smoke.ps1
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TAURI_CLI_VERSION: 2.11.4

concurrency:
  # A newer push to the same pull request supersedes the running checks.
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan platforms
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - name: Choose platforms
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pull requests build and smoke-test Linux only; main, tags, and manual
          # runs build every platform, so packaging regressions still surface
          # before a release.
          linux='{"runner":"ubuntu-24.04","platform":"linux-x86_64","target":"x86_64-unknown-linux-gnu","binary_path":"apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/musubicad-desktop","bundles":"deb,appimage","bundle_directory":"apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"}'
          windows='{"runner":"windows-2022","platform":"windows-x86_64","target":"x86_64-pc-windows-msvc","binary_path":"apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/musubicad-desktop.exe","bundles":"msi,nsis","bundle_directory":"apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"}'
          mac_arm='{"runner":"macos-15","platform":"macos-aarch64","target":"aarch64-apple-darwin","binary_path":"apps/desktop/src-tauri/target/aarch64-apple-darwin/release/musubicad-desktop","bundles":"app,dmg","bundle_directory":"apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"}'
          mac_intel='{"runner":"macos-15-intel","platform":"macos-x86_64","target":"x86_64-apple-darwin","binary_path":"apps/desktop/src-tauri/target/x86_64-apple-darwin/release/musubicad-desktop","bundles":"app,dmg","bundle_directory":"apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle"}'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            include="[$linux]"
          else
            include="[$windows,$linux,$mac_arm,$mac_intel]"
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            wget \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1
          command -v patchelf

      - name: Verify Apple SDK
        if: ${{ startsWith(matrix.platform, 'macos-') }}
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

      - name: Verify MSVC toolchain
        if: ${{ matrix.platform == 'windows-x86_64' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'Visual Studio installation discovery (vswhere) is missing'
          }
          $installationVersion = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationVersion)) {
            throw 'The MSVC C++ workload is not installed'
          }
          if ([version]$installationVersion -lt [version]'17.14') {
            throw "MSVC 14.44 or newer is required; found Visual Studio $installationVersion"
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo and OCCT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-${{ matrix.target }}-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-${{ matrix.target }}-${{ env.TAURI_CLI_VERSION }}-

      - name: Install pinned Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          expected="tauri-cli $TAURI_CLI_VERSION"
          actual="$(cargo tauri --version 2>/dev/null || true)"
          if [ "$actual" != "$expected" ]; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked --force
          fi
          test "$(cargo tauri --version)" = "$expected"

      - name: Verify locked desktop dependency graph
        working-directory: apps/desktop/src-tauri
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Resolve and verify desktop version
        id: version
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'musubicad-desktop' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one musubicad-desktop package, found $($packages.Count)"
          }
          $cargoVersion = [string]$packages[0].version
          $config = Get-Content -Raw tauri.conf.json | ConvertFrom-Json
          $tauriVersion = [string]$config.version
          if ([string]::IsNullOrWhiteSpace($cargoVersion) -or
              [string]::IsNullOrWhiteSpace($tauriVersion)) {
            throw 'Desktop Cargo.toml and tauri.conf.json must both declare a version'
          }
          if ($cargoVersion -ne $tauriVersion) {
            throw "Desktop version mismatch: Cargo.toml=$cargoVersion tauri.conf.json=$tauriVersion"
          }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and
              $env:RELEASE_REF_NAME -ne "v$cargoVersion") {
            throw "Tag $env:RELEASE_REF_NAME does not match desktop version $cargoVersion"
          }
          "version=$cargoVersion" >> $env:GITHUB_OUTPUT

      - name: Clear cached desktop bundle outputs
        shell: pwsh
        run: >-
          ./tools/clear-desktop-bundle.ps1
          -BundleDirectory "${{ matrix.bundle_directory }}"

      - name: Build and bundle Tauri application
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          build() { cargo tauri build --ci --bundles "$BUNDLES" --target "$TARGET"; }
          # hdiutil on hosted macOS runners intermittently fails inside
          # bundle_dmg.sh; the compiled binaries are reused, so retry once.
          if ! build; then
            case "$BUNDLES" in
              *dmg*) echo "::warning::DMG bundling failed; retrying once"; sleep 15; build ;;
              *) exit 1 ;;
            esac
          fi

      - name: Verify native executable
        shell: bash
        env:
          DESKTOP_BINARY: ${{ matrix.binary_path }}
        run: |
          test -f "$DESKTOP_BINARY"
          test -s "$DESKTOP_BINARY"

      - name: Verify build did not rewrite the lockfile
        shell: bash
        run: git diff --exit-code -- apps/desktop/src-tauri/Cargo.lock

      - name: Package desktop artifacts and generate checksums
        shell: pwsh
        run: >-
          ./tools/package-desktop-release.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Platform "${{ matrix.platform }}"
          -BundleDirectory "${{ matrix.bundle_directory }}"
          -OutputDirectory dist

      - name: Verify desktop artifact contract
        shell: pwsh
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath dist -File | Where-Object Name -ne 'SHA256SUMS')
          if ($artifacts.Count -ne 2) {
            throw "Expected two packaged desktop artifacts, found $($artifacts.Count)"
          }
          $prefix = "musubicad-v$env:DESKTOP_VERSION-$env:DESKTOP_PLATFORM"
          foreach ($artifact in $artifacts) {
            if (-not $artifact.Name.StartsWith($prefix, [System.StringComparison]::Ordinal)) {
              throw "Artifact is not versioned with the desktop contract: $($artifact.Name)"
            }
            if ($artifact.Length -eq 0) {
              throw "Artifact is empty: $($artifact.Name)"
            }
          }
          $checksumLines = @(Get-Content -LiteralPath dist/SHA256SUMS | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($checksumLines.Count -ne $artifacts.Count) {
            throw 'SHA256SUMS must contain one entry per packaged artifact'
          }
          $checksumNames = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $checksumLines) {
            $match = [regex]::Match($line, '^([0-9a-fA-F]{64})  (.+)$')
            if (-not $match.Success) {
              throw "Invalid SHA256SUMS entry: $line"
            }
            $name = $match.Groups[2].Value
            $artifact = $artifacts | Where-Object Name -eq $name
            if ($null -eq $artifact) {
              throw "SHA256SUMS references an unexpected file: $name"
            }
            $checksumNames.Add($name)
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash
            if ($actual -ine $match.Groups[1].Value) {
              throw "SHA-256 verification failed for $name"
            }
          }
          $uniqueChecksumNames = @($checksumNames | Sort-Object -Unique)
          if ($uniqueChecksumNames.Count -ne $artifacts.Count) {
            throw 'SHA256SUMS must reference every artifact exactly once'
          }
          foreach ($artifact in $artifacts) {
            if (-not ($checksumNames -contains $artifact.Name)) {
              throw "SHA256SUMS does not cover artifact: $($artifact.Name)"
            }
          }

      - name: Upload versioned desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musubicad-desktop-v${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  backend-smoke:
    name: headless backend and packaged Linux smoke
    needs: build
    runs-on: ubuntu-24.04
    env:
      WGPU_BACKEND: vulkan

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libvulkan1 \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and OCCT
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-

      - name: Run headless backend smoke and command parity audit
        run: |
          cargo test --locked -p opencad-desktop --test desktop_smoke --features occt -- --nocapture
          cargo test --locked -p opencad-desktop --test command_parity

      - name: Download packaged Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: musubicad-desktop-v*-linux-x86_64
          path: dist
          merge-multiple: true

      - name: Verify packaged Linux installer checksums
        shell: bash
        run: |
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1

      - name: Run packaged Linux AppImage smoke
        shell: bash
        run: |
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          work_dir="$RUNNER_TEMP/musubicad-desktop-smoke.ocad.d"
          test ! -e "$work_dir"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" \
            --smoke-test "$GITHUB_WORKSPACE/examples/bracket.ocad.d" "$work_dir"
